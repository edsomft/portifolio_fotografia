<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato | Nyx Studio</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo">NYX<span>.studio</span></a>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="detalhes.html">Trabalhos</a></li>
        <li><a href="contato.html">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section class="hero">
      <h1>Vamos conversar</h1>
      <p>Conte um pouco sobre o seu projeto e retornamos em até 2 dias úteis.</p>
    </section>

    <section class="contact">
      <form class="contact-form" action="#" method="post">

        <div class="form-group">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="voce@email.com" required>
        </div>

        <div class="form-group">
          <label for="tipo">Tipo de sessão</label>
          <select id="tipo" name="tipo">
            <option value="retrato">Retrato</option>
            <option value="arquitetura">Arquitetura</option>
            <option value="still-life">Still Life</option>
            <option value="outro">Outro</option>
          </select>
        </div>

        <div class="form-group">
          <label for="mensagem">Mensagem</label>
          <textarea id="mensagem" name="mensagem" rows="5" placeholder="Descreva sua ideia..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Enviar mensagem</button>

      </form>

      <aside class="contact-info">
        <h2>Informações</h2>
        <p><strong>Estúdio:</strong> Aracati, CE</p>
        <p><strong>E-mail:</strong> contato@nyxstudio.com</p>
        <p><strong>Instagram:</strong> @nyx.studio</p>
      </aside>
    </section>

  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Nyx Studio. Todos os direitos reservados.</p>
  </footer>

</body>
</html>
